apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: research-api
  template:
    metadata:
      labels:
        app: research-api
    spec:
      containers:
        - name: api
          image: research-workspace-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: research-api-secrets
            - configMapRef:
                name: research-api-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

